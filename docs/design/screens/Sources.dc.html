<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Source picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{width:1920px;height:1080px;position:relative;overflow:hidden;background:#0B0D12;color:#F4F5F7;font-family:'Figtree',sans-serif}
.chip{height:50px;padding:0 22px;border-radius:25px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#D5D9E1;font-size:22px;font-weight:700;font-family:inherit}
.q{flex:none;width:96px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.t{font-size:18px;font-weight:700;color:#D5D9E1;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:2px 8px}
</style>
</helmet>
<div class="scr">
  <div style="position:absolute;inset:0;background:#3b4256"></div>
  <div style="position:absolute;inset:0;background:rgba(11,13,18,.72)"></div>
  <div style="position:absolute;left:96px;bottom:110px;width:820px;display:flex;flex-direction:column;gap:14px">
    <div style="font-size:24px;color:#A7AEBB;font-weight:700">HARBOUR LIGHTS · S2 · E4</div>
    <div style="font-size:64px;font-weight:800;line-height:1">Low Tide</div>
    <div style="font-size:24px;color:#D5D9E1;line-height:1.45">A storm strands half the town on the causeway.</div>
  </div>

  <div style="position:absolute;top:0;right:0;bottom:0;width:900px;background:rgba(18,21,28,.94);border-left:1px solid rgba(255,255,255,.12);padding:56px 56px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:40px;font-weight:800">Choose a source</div>
      <div style="font-size:22px;color:#A7AEBB">7 found · 2 still loading</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="chip" style="background:#F4F5F7;color:#0B0D12">All</button><button class="chip">1080p</button><button class="chip">720p</button><button class="chip">SD</button>
      <div style="flex:1"></div>
      <button class="chip">Sort: best first</button>
    </div>
    <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden"><div style="width:70%;height:100%;background:#7FB2FF"></div></div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;gap:22px;padding:16px 20px;border-radius:18px;{{r.st}}">
          <div class="q" style="{{r.qst}}">{{r.q}}</div>
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
            <div style="font-size:26px;font-weight:700">{{r.name}}</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <sc-for list="{{r.tags}}" as="tg" hint-placeholder-count="2"><span class="t">{{tg}}</span></sc-for>
              <span style="font-size:20px;color:#A7AEBB">{{r.note}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:auto;display:flex;align-items:center;gap:16px;font-size:22px;color:#A7AEBB">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
      Auto-play: <b style="color:#F4F5F7">best match</b> (Settings › Player). Hold OK on a source to copy its link.
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const hq = 'background:#F4F5F7;color:#0B0D12';
    const mq = 'background:rgba(255,255,255,.14);color:#F4F5F7';
    return {
      rows: [
        { q: '1080p', qst: hq, name: 'Vidstream · mirror 1', tags: ['HLS', 'EN', 'SUB ×3'], note: 'Last played source', st: 'background:rgba(255,255,255,.1);box-shadow:0 0 0 4px #F4F5F7;' },
        { q: '1080p', qst: hq, name: 'Filehost A', tags: ['MP4', 'EN'], note: '1.4 GB', st: '' },
        { q: '720p', qst: mq, name: 'Vidstream · mirror 2', tags: ['HLS', 'EN', 'SUB ×3'], note: '', st: '' },
        { q: '720p', qst: mq, name: 'Mirror C', tags: ['DASH', 'EN'], note: '', st: '' },
        { q: 'SD', qst: mq, name: 'Filehost B', tags: ['MP4'], note: '', st: '' },
        { q: '—', qst: 'background:transparent;color:#6B7280;border:1px dashed #4B5160', name: 'Embedded player page', tags: ['WEBVIEW'], note: 'Needs a browser engine — not available on webOS', st: 'opacity:.55;' }
      ]
    };
  }
}
</script>
</body>
</html>
