<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player tracks panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{width:1920px;height:1080px;position:relative;overflow:hidden;background:#000;color:#F4F5F7;font-family:'Figtree',sans-serif}
.tab{height:54px;padding:0 24px;border-radius:27px;border:0;background:transparent;color:#A7AEBB;font-size:24px;font-weight:700;font-family:inherit}
.row{display:flex;align-items:center;gap:18px;height:72px;padding:0 22px;border-radius:16px;font-size:26px;font-weight:600}
.src{margin-left:auto;font-size:20px;color:#A7AEBB;font-weight:600}
.step{width:56px;height:56px;border-radius:28px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#F4F5F7;font-size:30px;font-family:inherit}
</style>
</helmet>
<div class="scr">
  <div style="position:absolute;inset:0;background:#26313a"></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.35)"></div>
  <div style="position:absolute;left:0;right:820px;bottom:120px;display:flex;justify-content:center">
    <div style="font-size:40px;font-weight:600;background:rgba(0,0,0,.55);padding:6px 18px;border-radius:8px;text-align:center;line-height:1.3">The tide won't wait for us, Mara.<br>We cross now or not at all.</div>
  </div>
  <div style="position:absolute;left:80px;bottom:60px;font-size:20px;color:#D5D9E1">Live preview of the subtitle style</div>

  <div style="position:absolute;top:0;right:0;bottom:0;width:820px;background:rgba(18,21,28,.95);border-left:1px solid rgba(255,255,255,.12);padding:48px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;gap:6px;padding:5px;border-radius:32px;background:rgba(255,255,255,.07);align-self:flex-start">
      <button class="tab" style="background:#F4F5F7;color:#0B0D12">Subtitles</button><button class="tab">Audio</button><button class="tab">Quality</button><button class="tab">Speed</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="row">Off</div>
      <div class="row" style="background:rgba(255,255,255,.1);box-shadow:0 0 0 4px #F4F5F7">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>English<span class="src">from source · VTT</span>
      </div>
      <div class="row">English (SDH)<span class="src">OpenSubtitles</span></div>
      <div class="row">Español<span class="src">Subdl</span></div>
      <div class="row">Français<span class="src">embedded</span></div>
      <div class="row" style="color:#7FB2FF">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search subtitles online…</div>
    </div>
    <div style="height:1px;background:rgba(255,255,255,.12)"></div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="font-size:24px;font-weight:700;flex:1">Sync (delay)</div>
      <button class="step" aria-label="Earlier">−</button>
      <div style="font-size:28px;font-weight:800;width:120px;text-align:center">−0.3 s</div>
      <button class="step" aria-label="Later">+</button>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="font-size:24px;font-weight:700;flex:1">Size</div>
      <button class="step" aria-label="Smaller">−</button>
      <div style="font-size:28px;font-weight:800;width:120px;text-align:center">110%</div>
      <button class="step" aria-label="Larger">+</button>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="font-size:24px;font-weight:700;flex:1">Style</div>
      <div style="width:56px;height:56px;border-radius:28px;background:#F4F5F7;box-shadow:0 0 0 3px #7FB2FF"></div>
      <div style="width:56px;height:56px;border-radius:28px;background:#FFE15A"></div>
      <div style="height:56px;padding:0 20px;border-radius:28px;background:rgba(255,255,255,.08);display:flex;align-items:center;font-size:22px;font-weight:700">Box</div>
      <div style="height:56px;padding:0 20px;border-radius:28px;background:rgba(255,255,255,.08);display:flex;align-items:center;font-size:22px;font-weight:700">Outline</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
