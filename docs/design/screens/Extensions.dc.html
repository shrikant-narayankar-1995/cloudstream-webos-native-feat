<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extensions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{width:1920px;height:1080px;position:relative;overflow:hidden;background:#0B0D12;color:#F4F5F7;font-family:'Figtree',sans-serif}
.pill{height:56px;padding:0 26px;border-radius:28px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;border:0;font-family:inherit}
.chip{height:48px;padding:0 20px;border-radius:24px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#D5D9E1;font-size:20px;font-weight:700;font-family:inherit}
.st{font-size:18px;font-weight:800;border-radius:6px;padding:3px 10px}
</style>
</helmet>
<div class="scr">
  <div style="position:absolute;left:96px;top:64px;font-size:56px;font-weight:800">Extensions</div>
  <div style="position:absolute;right:96px;top:72px;display:flex;gap:12px">
    <button class="pill" style="background:rgba(255,255,255,.08);color:#F4F5F7">Update all (2)</button>
    <button class="pill" style="background:#F4F5F7;color:#0B0D12"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add repository</button>
  </div>

  <div style="position:absolute;left:96px;top:180px;width:520px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:22px;color:#A7AEBB;font-weight:700">REPOSITORIES</div>
    <sc-for list="{{repos}}" as="r" hint-placeholder-count="3">
      <div style="padding:22px;border-radius:18px;display:flex;flex-direction:column;gap:6px;{{r.st}}">
        <div style="font-size:26px;font-weight:700">{{r.n}}</div>
        <div style="font-size:20px;color:#A7AEBB">{{r.m}}</div>
      </div>
    </sc-for>
    <div style="margin-top:12px;padding:22px;border-radius:18px;border:2px dashed rgba(255,255,255,.18);display:flex;gap:22px;align-items:center">
      <div style="flex:none;width:120px;height:120px;border-radius:12px;background:#F4F5F7;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:10px;box-sizing:border-box">
        <sc-for list="{{qr}}" as="q" hint-placeholder-count="36"><div style="background:{{q}}"></div></sc-for>
      </div>
      <div style="font-size:21px;color:#D5D9E1;line-height:1.45">Add from your phone: scan, paste a repository URL or shortcode, and it appears here. Plugins are installed only after you confirm.</div>
    </div>
  </div>

  <div style="position:absolute;left:680px;right:96px;top:180px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;gap:10px;align-items:center">
      <div style="font-size:30px;font-weight:800;margin-right:12px">Official extensions</div>
      <button class="chip" style="background:#F4F5F7;color:#0B0D12">All 34</button><button class="chip">Installed 6</button><button class="chip">Updates 2</button>
      <div style="flex:1"></div>
      <button class="chip">Language: EN</button><button class="chip">Type: all</button>
    </div>
    <sc-for list="{{plugins}}" as="p" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:22px;padding:16px 22px;border-radius:18px;{{p.rowst}}">
        <div style="flex:none;width:64px;height:64px;border-radius:16px;background:{{p.bg}};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">{{p.i}}</div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
          <div style="display:flex;gap:12px;align-items:center"><span style="font-size:26px;font-weight:700">{{p.n}}</span><span style="font-size:20px;color:#A7AEBB">v{{p.v}} · {{p.meta}}</span></div>
          <div style="font-size:20px;color:#A7AEBB">{{p.d}}</div>
        </div>
        <span class="st" style="{{p.sst}}">{{p.s}}</span>
        <button class="pill" style="height:52px;{{p.ast}}">{{p.a}}</button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'background:rgba(110,231,160,.16);color:#7EE7A6';
    const up = 'background:rgba(127,178,255,.18);color:#9CC3FF';
    const bad = 'background:rgba(255,184,102,.16);color:#FFC48A';
    const prim = 'background:#F4F5F7;color:#0B0D12';
    const sec = 'background:rgba(255,255,255,.08);color:#F4F5F7';
    const qr = []; for (let i = 0; i < 36; i++) qr.push(((i * 7 + (i >> 2)) % 3) ? '#0B0D12' : '#F4F5F7');
    return {
      qr,
      repos: [
        { n: 'Official extensions', m: '34 plugins · updated 2 days ago · hash-checked', st: 'background:rgba(255,255,255,.1);box-shadow:0 0 0 4px #F4F5F7;' },
        { n: 'Audiobooks & radio', m: '8 plugins · updated today', st: 'background:rgba(255,255,255,.04);' },
        { n: '[Your repository]', m: 'Added from phone · 12 plugins', st: 'background:rgba(255,255,255,.04);' }
      ],
      plugins: [
        { n: 'Internet Archive', i: 'IA', bg: '#3b4256', v: '1', meta: 'Movies, Others · EN', d: 'Public-domain films and recordings', s: 'Installed', sst: ok, a: 'Remove', ast: sec, rowst: '' },
        { n: 'Dailymotion', i: 'DM', bg: '#2f4a44', v: '5', meta: 'Others · EN', d: 'Update available (v4 → v5)', s: 'Update', sst: up, a: 'Update', ast: prim, rowst: 'background:rgba(255,255,255,.1);box-shadow:0 0 0 4px #F4F5F7;' },
        { n: 'LibriVox', i: 'LV', bg: '#4a3b2b', v: '34', meta: 'Audiobooks · EN', d: 'Has settings', s: 'Installed', sst: ok, a: 'Settings', ast: sec, rowst: '' },
        { n: 'Example Live TV', i: 'TV', bg: '#40354f', v: '2', meta: 'Live · EN', d: 'Not installed', s: '', sst: 'display:none', a: 'Install', ast: sec, rowst: '' },
        { n: 'Example Web Player', i: 'WP', bg: '#3b3b3b', v: '7', meta: 'Movies · EN', d: 'Needs a WebView (browser engine), which webOS apps cannot use here', s: 'Not supported', sst: bad, a: 'Details', ast: sec, rowst: 'opacity:.7;' }
      ]
    };
  }
}
</script>
</body>
</html>
